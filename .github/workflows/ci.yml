name: CI

on:
  # Every push to the main branch and to feature branches
  push:
    branches:
      - main
      - 'feature/**'
  # A new PR into main and every new commit in it
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Nightly run (only from the default branch)
  schedule:
    - cron: '15 0 * * *'
  # Manual run from the Actions tab
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        type: choice
        options:
          - ui
          - api
          - all
        required: true
        default: 'all'

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # Git hooks are not needed on the runner
  HUSKY: 0
  # Fixed version: tests do not change their behaviour because of a new release
  JUICE_SHOP_IMAGE: bkimminich/juice-shop:v20.2.0
  BASE_URL: http://localhost:3000
  LOCAL_START: 'false'

jobs:
  lint:
    name: Lint & Format
    # `env` is not available in `runs-on`, the value is shared with a YAML anchor (fixed runner image)
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  api:
    name: API tests
    # api and ui run in parallel after lint
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'api' || inputs.test_type == 'all' }}
    runs-on: *runner
    timeout-minutes: 10
    env:
      # Not secret: a variable from Settings
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://reqres.in/' }}
      # Secret: masked in the logs
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 ${{ env.JUICE_SHOP_IMAGE }}

      - name: Wait for Juice Shop
        run: |
          timeout 120 bash -c 'until curl -fs -o /dev/null ${{ env.BASE_URL }}; do sleep 2; done' \
            || { echo "::error::Juice Shop did not start in 120 seconds"; exit 1; }

      - name: Run API tests
        run: npm run test:api

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-api
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Juice Shop logs
        if: failure()
        run: docker logs --tail 200 juice-shop

  ui:
    name: UI tests (${{ matrix.browser }})
    # api and ui run in parallel after lint
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'ui' || inputs.test_type == 'all' }}
    runs-on: *runner
    timeout-minutes: 10
    # Browsers and their system libraries are already in the image: no apt and no browser download
    container:
      # The tag must match the Playwright version in package-lock.json
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Running as the same user as the GitHub runner
      options: --user 1001
    # Juice Shop runs next to the job container and is reachable by the service name
    services:
      juice-shop:
        # Same as JUICE_SHOP_IMAGE: `env` is not available in `services`
        image: bkimminich/juice-shop:v20.2.0
    env:
      BASE_URL: http://juice-shop:3000
    strategy:
      # By default - true, the failure of one job in a matrix cancels the others
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Juice Shop
        run: |
          timeout 120 bash -c 'until curl -fs -o /dev/null ${{ env.BASE_URL }}; do sleep 2; done' \
            || { echo "::error::Juice Shop did not start in 120 seconds"; exit 1; }

      - name: Run UI tests
        run: npm run test:ui -- --project=${{ matrix.browser }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ui-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
