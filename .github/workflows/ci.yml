name: CI

on:
  # Every push to the main branch and to feature branches
  push:
    branches:
      - main
      - 'feature/**'
  # A new PR into main and every new commit in it
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Nightly run (only from the default branch)
  schedule:
    - cron: '15 0 * * *'
  # Manual run from the Actions tab
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        type: choice
        options:
          - ui
          - api
          - all
        required: true
        default: 'all'

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # Git hooks are not needed on the runner
  HUSKY: 0
  # Fixed version: tests do not change their behaviour because of a new release
  JUICE_SHOP_IMAGE: bkimminich/juice-shop:v20.2.0
  BASE_URL: http://localhost:3000
  LOCAL_START: 'false'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  api:
    name: API tests
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'api' || inputs.test_type == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Not secret: a variable from Settings
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://reqres.in/' }}
      # Secret: masked in the logs
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 ${{ env.JUICE_SHOP_IMAGE }}

      - name: Wait for Juice Shop
        run: timeout 120 bash -c 'until curl -fs -o /dev/null ${{ env.BASE_URL }}; do sleep 2; done' || { echo "::error::Juice Shop did not start in 120 seconds"; exit 1; }

      - name: Run API tests
        run: npm run test:api

      - name: Juice Shop logs
        if: failure()
        run: docker logs --tail 200 juice-shop

  ui:
    name: UI tests
    # Sequential run lint -> api -> ui
    needs: [lint, api]
    # `api` can be skipped by the manual run with test_type = ui, by default a skipped `needs` job skips this job too
    if: ${{ !cancelled() && needs.lint.result == 'success' && (needs.api.result == 'success' || needs.api.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.test_type == 'ui' || inputs.test_type == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers of the Playwright version from package-lock.json + system libraries for them
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 ${{ env.JUICE_SHOP_IMAGE }}

      - name: Wait for Juice Shop
        run: timeout 120 bash -c 'until curl -fs -o /dev/null ${{ env.BASE_URL }}; do sleep 2; done' || { echo "::error::Juice Shop did not start in 120 seconds"; exit 1; }

      - name: Run UI tests
        run: npm run test:ui

      - name: Juice Shop logs
        if: failure()
        run: docker logs --tail 200 juice-shop
